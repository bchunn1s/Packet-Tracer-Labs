<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a2e">DHCP Lab Topology</text>

  <!-- Router -->
  <g>
    <rect x="350" y="70" width="100" height="70" rx="8" fill="#2d5f8a" stroke="#1a3a52" stroke-width="2"/>
    <text x="400" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Router0</text>
    <text x="400" y="118" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e0e0e0">DHCP Server</text>
    <text x="400" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">Fa0/0: 192.168.1.1/24</text>
  </g>

  <!-- Link Router to Switch -->
  <line x1="400" y1="140" x2="400" y2="210" stroke="#333333" stroke-width="2"/>

  <!-- Switch -->
  <g>
    <rect x="330" y="210" width="140" height="60" rx="8" fill="#4a7c59" stroke="#2f4f3a" stroke-width="2"/>
    <text x="400" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Switch0</text>
  </g>

  <!-- Lines from switch to PCs -->
  <line x1="400" y1="270" x2="130" y2="400" stroke="#333333" stroke-width="2"/>
  <line x1="400" y1="270" x2="290" y2="400" stroke="#333333" stroke-width="2"/>
  <line x1="400" y1="270" x2="500" y2="400" stroke="#333333" stroke-width="2"/>
  <line x1="400" y1="270" x2="660" y2="400" stroke="#333333" stroke-width="2"/>

  <!-- PC0 -->
  <g>
    <rect x="80" y="400" width="100" height="60" rx="6" fill="#c9762f" stroke="#8a4f1f" stroke-width="2"/>
    <text x="130" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">PC0</text>
    <text x="130" y="443" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f0e0d0">DHCP Client</text>
  </g>

  <!-- PC1 -->
  <g>
    <rect x="240" y="400" width="100" height="60" rx="6" fill="#c9762f" stroke="#8a4f1f" stroke-width="2"/>
    <text x="290" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">PC1</text>
    <text x="290" y="443" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f0e0d0">DHCP Client</text>
  </g>

  <!-- PC2 -->
  <g>
    <rect x="450" y="400" width="100" height="60" rx="6" fill="#c9762f" stroke="#8a4f1f" stroke-width="2"/>
    <text x="500" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">PC2</text>
    <text x="500" y="443" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f0e0d0">DHCP Client</text>
  </g>

  <!-- PC3 -->
  <g>
    <rect x="610" y="400" width="100" height="60" rx="6" fill="#c9762f" stroke="#8a4f1f" stroke-width="2"/>
    <text x="660" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">PC3</text>
    <text x="660" y="443" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f0e0d0">DHCP Client</text>
  </g>

  <!-- Legend / Notes -->
  <g>
    <rect x="60" y="500" width="680" height="80" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
    <text x="80" y="522" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a2e">Network: 192.168.1.0/24</text>
    <text x="80" y="542" font-family="Arial, sans-serif" font-size="11" fill="#333333">Gateway (Router Fa0/0): 192.168.1.1</text>
    <text x="80" y="560" font-family="Arial, sans-serif" font-size="11" fill="#333333">DHCP Pool Range: 192.168.1.10 - 192.168.1.100 (example)</text>
    <text x="400" y="542" font-family="Arial, sans-serif" font-size="11" fill="#333333">Cabling: Copper Straight-Through</text>
    <text x="400" y="560" font-family="Arial, sans-serif" font-size="11" fill="#333333">All PCs set to "DHCP" (not static)</text>
  </g>
</svg>
